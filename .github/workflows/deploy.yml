name: Deploy JobPortal API

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cre8ive-collins/jobportal-api:latest

      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull ghcr.io/cre8ive-collins/jobportal-api:latest

            docker stop jobportal-api || true
            docker rm jobportal-api || true

            docker run -d \
              --name jobportal-api \
              --env-file /opt/apps/Jobportal/.env \
              -p 127.0.0.1:5005:5005 \
              --restart unless-stopped \
              ghcr.io/cre8ive-collins/jobportal-api:latest